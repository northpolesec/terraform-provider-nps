version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: ".github/"
    groups:
      all-actions-updates:
        patterns:
          - "*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1

  - package-ecosystem: "gomod"
    directory: "/"
    groups:
      all-go-updates:
        patterns:
          - "*"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
