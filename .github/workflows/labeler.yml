name: Process PRs

on: [pull_request]

jobs:
  labels:
    name: Labelers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
        with:
          sparse-checkout: .github
      - name: Apply Labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # ratchet:actions/labeler@v7.0.0
        with:
          configuration-path: .github/labeler-pr.yml
      - name: Apply Size Labels
        uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # ratchet:codelytv/pr-size-labeler@v1.12.0
        with:
          files_to_ignore: 'go.sum'

