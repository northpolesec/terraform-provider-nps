name: Process PRs

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  labels:
    name: Labelers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Apply Size Labels
        uses: codelytv/pr-size-labeler@19c335e7695ba922de938806dd129f0a9b992644 # ratchet:codelytv/pr-size-labeler@v1.12.0
        with:
          files_to_ignore: 'go.sum'
