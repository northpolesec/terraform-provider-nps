name: CI (Go)

on:
  pull_request:
    branches:
      - main

jobs:
  format-and-test:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: buf.build/gen/go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v4

      - name: Install buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # ratchet:bufbuild/buf-setup-action@v1
        with:
          version: "1.47.2"
          buf_user: ${{ secrets.BUF_USER }}
          buf_api_token: ${{ secrets.BUF_TOKEN }}

      - name: Install Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # ratchet:actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Check Go Format
        run: '[ ! "$(gofmt -s -l .)" ]'

      - name: Check go vet
        run: '[ ! "$(go vet ./...)" ]'

      - name: Build
        run: go build -v ./...

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # ratchet:hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
          terraform_version: "1.15.8"

      - name: Check generated docs
        run: |
          (cd tools && go generate)
          git add -A
          git diff --cached --exit-code

      - name: Test
        run: go test -race ./...

